#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades

runcmd:
  - systemctl enable --now docker
  # Temporary bootstrap access. Remove once NetBird is live.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=${tailscale_auth_key} --ssh --hostname=vm-ztlab-netbird-ukw
